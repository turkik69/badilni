<style>
  :root{
    --bg:#F7F4EC; --paper:#FFFFFF;
    --navy:#0F2A4D; --navy-2:#1C3A5E; --navy-deep:#081B31; --navy-black:#050D18;
    --gold:#C9942F; --gold-2:#D9A83E; --gold-light:#E9CE9C;
    --ink:#1A1F27; --muted:#6B6558; --line:#E4DFD1;
    --success:#3F6B4A; --success-bg:#E4EEE6;
    --warn:#8A3B26; --warn-bg:#F7E4DD;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; padding:0;}
  body{position:fixed; inset:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none;
    background:var(--bg); color:var(--ink); font-family:'Cairo',sans-serif; font-weight:500; -webkit-font-smoothing:antialiased;}
  #frame{width:100%; max-width:100vw; height:100%; background:var(--bg); display:flex; flex-direction:column; position:relative;}
  @media (min-width:640px){ #frame{max-width:600px; margin:0 auto; box-shadow:0 0 60px rgba(8,27,49,.12);} }
  svg.ic{display:inline-block; vertical-align:middle;}

  /* ---------- Splash ---------- */
  .splash{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(165deg,var(--navy-deep),var(--navy-black)); gap:16px;}
  .splash .mark{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.06);opacity:.85;}}
  .splash .word{color:var(--gold-light); font-weight:800; font-size:22px; letter-spacing:.5px;}

  /* ---------- Header / nav ----------
     direction:ltr هنا عمداً لتثبيت ترتيب المناطق الثلاث بصرياً (يسار/وسط/يمين)
     بشكل صريح لا يعتمد على انعكاس RTL الضمني - الذي كان يسبب تراكب العناصر */
  header.topbar{
    background:linear-gradient(165deg,var(--navy-deep),var(--navy-black)); color:#fff;
    padding:12px 14px 14px; padding-top:max(50px, calc(12px + env(safe-area-inset-top)));
    display:flex; direction:ltr; align-items:center; gap:8px; flex-shrink:0; min-height:26px;
  }
  header.topbar .zone{display:flex; align-items:center; gap:14px; flex:0 0 auto;}
  header.topbar .zone.title-zone{flex:1; min-width:0; justify-content:center;}

let state = {
  session:null, view:'dashboard', prevView:'dashboard', authStep:'phone', phoneNumber:'', otpSending:false, loading:false, authMsg:null, booting:true,
  categories:[], catMap:{},
  browseItems:[],
  myItems:[], myMatches:[], directOffers:[],
  viewingItem:null, offerPicking:false,
  balance:0, ledger:[],
  newPhotoUrl:null, uploading:false, selectedCat:null,
  activeDeal:null, dealMessages:[], dealChannel:null, myRating:0,
  profile:null, profileRating:null, completedCount:0, myItemsCount:0, recentReviews:[], editingName:false,
};

const frame = document.getElementById('frame');

async function init(){
  frame.innerHTML = `<div class="splash">${brandMark(84)}<div class="word">بادلني</div></div>`;
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  sb.auth.onAuthStateChange((_e, session) => { state.session = session; });
  await loadCategories();
  state.booting = false;
  render();
  if (state.session) await loadAllForCurrentTab();
  render();
}

async function loadCategories(){
  const { data, error } = await sb.from('categories').select('*').eq('is_active', true);
  if (!error && data){ state.categories = data; state.catMap = Object.fromEntries(data.map(c => [c.id, c])); }
}
function catName(id){ return id && state.catMap[id] ? state.catMap[id].name_ar : null; }
function catEmoji(id){ return id && state.catMap[id] ? (CAT_EMOJI[state.catMap[id].icon] || '🔹') : '🔹'; }

/* ================= AUTH (Phone + WhatsApp OTP) ================= */
function normalizePhone(raw){
  let p = raw.trim().replace(/[\s-]/g,'');
  if (!p.startsWith('+')){ p = p.replace(/^0+/,''); p = '+968' + p; }
  return p;
}
async function handleSendOtp(e){
  e.preventDefault();
  const raw = document.getElementById('auth-phone').value;
  const phone = normalizePhone(raw);
  state.authMsg = null;
  if (!/^\+\d{8,15}$/.test(phone)){ state.authMsg = {type:'err', text:'أدخل رقم هاتف صحيح'}; render(); return; }
  state.phoneNumber = phone;
  state.otpSending = true; render();
  const { error } = await sb.auth.signInWithOtp({ phone, options:{ channel:'whatsapp' } });
  state.otpSending = false;
  if (error){ state.authMsg = {type:'err', text:'تعذّر إرسال الرمز: ' + error.message}; render(); return; }
  state.authStep = 'otp'; render();
}
async function handleVerifyOtp(e){
  e.preventDefault();
  const code = document.getElementById('auth-otp').value.trim();
  state.authMsg = null;
  if (!code){ return; }
  const { data, error } = await sb.auth.verifyOtp({ phone: state.phoneNumber, token: code, type:'sms' });
  if (error){ state.authMsg = {type:'err', text:'الرمز غير صحيح أو منتهي الصلاحية'}; render(); return; }
  state.session = data.session;
  render();
  if (state.session){ await loadAllForCurrentTab(); render(); }
}
function backToPhoneStep(){ state.authStep = 'phone'; state.authMsg = null; render(); }
async function handleSignOut(){ await sb.auth.signOut(); state.session = null; state.view = 'dashboard'; state.authStep='phone'; render(); }

/* ================= LOADING ================= */
async function loadAllForCurrentTab(){
  state.loading = true; render();
  if (state.view === 'dashboard') await loadDashboard();
  else if (state.view === 'browse') await loadBrowse();
  else if (state.view === 'mine') await loadMine();
  else if (state.view === 'wallet') await loadWallet();
  else if (state.view === 'profile') await loadProfile();
  state.loading = false;
}
async function loadDashboard(){
  await Promise.all([loadMine(), loadWallet()]);
  const uid = state.session.user.id;
  const { data: r } = await sb.from('user_ratings').select('*').eq('user_id', uid).maybeSingle();
  state.profileRating = r;
}
async function loadProfile(){
  const uid = state.session.user.id;
  const { data: p } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
  state.profile = p;
  const { data: r } = await sb.from('user_ratings').select('*').eq('user_id', uid).maybeSingle();
  state.profileRating = r;
  const { count: itemCount } = await sb.from('items').select('id', {count:'exact', head:true}).eq('owner_id', uid);
  state.myItemsCount = itemCount || 0;
  const { data: myParts } = await sb.from('trade_offer_items').select('trade_offer_id').eq('offered_by', uid);
  const offerIds = [...new Set((myParts||[]).map(p=>p.trade_offer_id))];
  state.completedCount = 0;
  if (offerIds.length){
    const { count } = await sb.from('trade_offers').select('id', {count:'exact', head:true}).in('id', offerIds).eq('status','completed');
    state.completedCount = count || 0;
  }
  const { data: reviews } = await sb.from('reviews').select('*').eq('reviewee_id', uid).order('created_at',{ascending:false}).limit(3);
  state.recentReviews = reviews || [];
}
async function handleSaveName(){
  const name = document.getElementById('p-name').value.trim();
  const uid = state.session.user.id;
  const { error } = await sb.from('profiles').update({ full_name: name }).eq('id', uid);
  if (error){ alert('خطأ: '+error.message); return; }
  state.editingName = false;
  await loadProfile(); render();
}
async function loadBrowse(){
  const uid = state.session.user.id;
  const { data } = await sb.from('items').select('*').eq('status','available').neq('owner_id', uid).order('created_at',{ascending:false});
  state.browseItems = data || [];
}
async function loadMine(){
  const uid = state.session.user.id;
  const { data: mine } = await sb.from('items').select('*').eq('owner_id', uid).order('created_at',{ascending:false});
  state.myItems = mine || [];
  const myIds = state.myItems.map(i=>i.id);
  state.myMatches = [];
  state.directOffers = [];
  if (!myIds.length) return;

  // ---- المطابقات التلقائية (محرك التوفيق) ----
  const { data: myLinks } = await sb.from('match_items').select('match_id,item_id').in('item_id', myIds);
  if (myLinks && myLinks.length){
    const matchIds = [...new Set(myLinks.map(m=>m.match_id))];
    const { data: allLinks } = await sb.from('match_items').select('match_id,item_id').in('match_id', matchIds);
    const { data: matchRows } = await sb.from('matches').select('id,status').in('id', matchIds);
    const mStatus = Object.fromEntries((matchRows||[]).map(m=>[m.id,m.status]));
    const otherIds = [...new Set((allLinks||[]).filter(l=>!myIds.includes(l.item_id)).map(l=>l.item_id))];
    let otherItems = {};
    if (otherIds.length){ const { data: oi } = await sb.from('items').select('*').in('id', otherIds); otherItems = Object.fromEntries((oi||[]).map(i=>[i.id,i])); }
    const { data: existingOffers } = await sb.from('trade_offers').select('*').in('match_id', matchIds);
    const offerByMatch = Object.fromEntries((existingOffers||[]).map(o=>[o.match_id,o]));
    matchIds.forEach(mid=>{
      const links=(allLinks||[]).filter(l=>l.match_id===mid);
      const mine=links.find(l=>myIds.includes(l.item_id));
      const other=links.find(l=>!myIds.includes(l.item_id));
      if (mine && other && otherItems[other.item_id]){
        state.myMatches.push({matchId:mid, status:mStatus[mid]||'suggested', myItem:state.myItems.find(i=>i.id===mine.item_id), otherItem:otherItems[other.item_id], offer:offerByMatch[mid]||null});
      }
    });
  }

  // ---- العروض المباشرة (بدأتها أنا، أو موجَّهة لأحد أغراضي) ----
  const { data: myParticipant } = await sb.from('trade_offer_items').select('trade_offer_id, item_id').eq('offered_by', uid);
  const myOfferIds = [...new Set((myParticipant||[]).map(p=>p.trade_offer_id))];
  const { data: targetingMe } = await sb.from('trade_offers').select('*').in('target_item_id', myIds);
  const offerMap = {};
  (targetingMe||[]).forEach(o => offerMap[o.id] = o);
  let initiatedOffers = [];
  if (myOfferIds.length){
    const { data: io } = await sb.from('trade_offers').select('*').in('id', myOfferIds).not('target_item_id','is', null);
    initiatedOffers = io || [];
  }
  initiatedOffers.forEach(o => offerMap[o.id] = o);

  const directOfferRows = Object.values(offerMap);
  if (directOfferRows.length){
    const myItemIdByOffer = {};
    (myParticipant||[]).forEach(p => { myItemIdByOffer[p.trade_offer_id] = p.item_id; });
    const otherIdsNeeded = [];
    directOfferRows.forEach(o=>{
      if (!myIds.includes(o.target_item_id)) otherIdsNeeded.push(o.target_item_id);
    });
    const { data: parts } = await sb.from('trade_offer_items').select('*').in('trade_offer_id', directOfferRows.map(o=>o.id));
    (parts||[]).forEach(p=>{ if (!myIds.includes(p.item_id)) otherIdsNeeded.push(p.item_id); });
    let otherItemsMap = {};
    const uniqOther = [...new Set(otherIdsNeeded)];
    if (uniqOther.length){ const { data: oi } = await sb.from('items').select('*').in('id', uniqOther); otherItemsMap = Object.fromEntries((oi||[]).map(i=>[i.id,i])); }

    directOfferRows.forEach(o=>{
      const myPartItemId = myItemIdByOffer[o.id];
      const targetIsMine = myIds.includes(o.target_item_id);
      const myItem = myPartItemId ? state.myItems.find(i=>i.id===myPartItemId) : (targetIsMine ? state.myItems.find(i=>i.id===o.target_item_id) : null);
      let otherItem = null;
      if (targetIsMine){
        const otherPart = (parts||[]).find(p=>p.trade_offer_id===o.id && !myIds.includes(p.item_id));
        otherItem = otherPart ? otherItemsMap[otherPart.item_id] : null;
      } else {
        otherItem = otherItemsMap[o.target_item_id];
      }
      const iJoined = !!myPartItemId;
      state.directOffers.push({ offer:o, myItem, otherItem, iJoined, needsToJoin: targetIsMine && !iJoined });
    });
  }
}

async function openDealGeneric({ offer, matchId, targetItemId, myItem, otherItem }){
  state.loading = true; render();
  const uid = state.session.user.id;
  if (!offer){
    const payload = { status:'negotiating' };
    if (matchId) payload.match_id = matchId;
    if (targetItemId) payload.target_item_id = targetItemId;
    const { data: created, error } = await sb.from('trade_offers').insert(payload).select().single();
    if (error){ alert('خطأ: '+error.message); state.loading=false; render(); return; }
    offer = created;
  }
  if (myItem){
    await sb.from('trade_offer_items').upsert({ trade_offer_id: offer.id, item_id: myItem.id, offered_by: uid }, { onConflict:'trade_offer_id,item_id' });
  }
  await loadDeal(offer.id, { myItem, otherItem });
  state.view = 'deal';
  state.loading = false;
  render();
}

async function loadDeal(offerId, matchCtx){
  const uid = state.session.user.id;
  const { data: offer } = await sb.from('trade_offers').select('*').eq('id', offerId).single();
  const { data: parts } = await sb.from('trade_offer_items').select('*').eq('trade_offer_id', offerId);
  const { data: confirms } = await sb.from('trade_confirmations').select('*').eq('trade_offer_id', offerId);
  let myItem = matchCtx ? matchCtx.myItem : null, otherItem = matchCtx ? matchCtx.otherItem : null;
  if ((!myItem || !otherItem) && parts && parts.length){
    const itemIds = parts.map(p=>p.item_id);
    const { data: items } = await sb.from('items').select('*').in('id', itemIds);
    myItem = (items||[]).find(i=>i.owner_id===uid) || myItem;
    otherItem = (items||[]).find(i=>i.owner_id!==uid) || otherItem;
  }
  const otherOwnerId = otherItem ? otherItem.owner_id : null;
  let otherRating = null;
  if (otherOwnerId){ const { data: r } = await sb.from('user_ratings').select('*').eq('user_id', otherOwnerId).maybeSingle(); otherRating = r; }
  const iJoined = (parts||[]).some(p=>p.offered_by===uid);
  const theyJoined = (parts||[]).some(p=>p.offered_by===otherOwnerId);
  const iConfirmed = (confirms||[]).some(c=>c.user_id===uid);
  const theyConfirmed = (confirms||[]).some(c=>c.user_id===otherOwnerId);
  const myHold = (await sb.from('points_ledger').select('id').eq('related_trade_offer_id', offerId).eq('transaction_type','hold').eq('user_id', uid)).data;
  state.activeDeal = { offer, myItem, otherItem, otherOwnerId, otherRating, iJoined, theyJoined, iConfirmed, theyConfirmed, iHeldPoints: !!(myHold && myHold.length) };
  const { data: msgs } = await sb.from('messages').select('*').eq('trade_offer_id', offerId).order('created_at',{ascending:true});
  state.dealMessages = msgs || [];
  subscribeToDeal(offerId);
}

function subscribeToDeal(offerId){
  if (state.dealChannel) sb.removeChannel(state.dealChannel);
  state.dealChannel = sb.channel('deal-'+offerId)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages', filter:'trade_offer_id=eq.'+offerId}, payload=>{
      state.dealMessages.push(payload.new);
      renderDealMessagesOnly();
    }).subscribe();
}
function leaveDeal(){
  if (state.dealChannel){ sb.removeChannel(state.dealChannel); state.dealChannel=null; }
  state.activeDeal=null; state.dealMessages=[];
  state.view='mine'; render(); loadMine().then(render);
}

function renderMine(){
  const suggested = state.myMatches.filter(m=>m.status==='suggested');
  const others = state.myMatches.filter(m=>m.status!=='suggested');
  let html = `<h2 class="section-title">${icon('swap',18,'#0F2A4D')} مطابقات جديدة (${suggested.length})</h2>`;
  if (!suggested.length){
    html += `<div class="empty" style="padding:16px 10px 30px;">لا مطابقات جديدة - تظهر تلقائياً عند وجود غرض آخر يريد فئة أغراضك ويملك ما تريده</div>`;
  } else {
    html += suggested.map(m=>matchCardHtml(m)).join('');
  }
  if ((state.directOffers||[]).length){
    html += `<h2 class="section-title" style="margin-top:22px;">${icon('user',17,'#0F2A4D')} عروض مباشرة (${state.directOffers.length})</h2>`;
    html += state.directOffers.map(o=>directOfferCardHtml(o)).join('');
  }
  if (others.length){
    html += `<h2 class="section-title" style="margin-top:22px;">صفقاتي (${others.length})</h2>`;
    html += others.map(m=>matchCardHtml(m)).join('');
  }
  html += `<h2 class="section-title" style="margin-top:26px;">${icon('box',18,'#0F2A4D')} أغراضي المنشورة (${state.myItems.length})</h2>`;
  if (!state.myItems.length) html += `<div class="empty">لا يوجد غرض مضاف بعد</div>`;
  else html += state.myItems.map(it=>`
    <div class="item item-tap" onclick="openItemDetailById('${it.id}')">${itemPhoto(it)}<span class="value-tag">${it.estimated_value} ر.ع</span>
      <div class="body"><div class="cat">${catEmoji(it.category_id)} ${catName(it.category_id)||''}</div><h3>${escapeHtml(it.title)}</h3>
      <span class="cond">${COND_LABEL[it.condition]||it.condition} · ${it.status==='available'?'متاح':STATUS_LABEL[it.status]||it.status}</span></div>
    </div>`).join('');
  return html;
}
function matchCardHtml(m){
  return `<div class="match-card">
    <div class="badge">${icon('swap',16,'#C9942F')} ${STATUS_LABEL[m.status]}</div>
    <div class="match-row">
      <div class="match-item-box"><div class="lbl">غرضك</div><div class="nm">${escapeHtml(m.myItem.title)}</div></div>
      <span style="color:#C9942F;">⇄</span>
      <div class="match-item-box"><div class="lbl">غرض الطرف الآخر</div><div class="nm">${escapeHtml(m.otherItem.title)}</div></div>
    </div>
    ${m.status==='suggested' ? `<div class="row-btns">
        <button class="btn sm" onclick="handleAcceptMatch('${m.matchId}')">${icon('check',15,'#fff')} أعجبتني</button>
        <button class="btn sm ghost" onclick="handleDismissMatch('${m.matchId}')">تجاهل</button>
      </div>` : m.status==='dismissed' ? '' : `<button class="btn sm gold" onclick='openDealFromMine("${m.matchId}")'>${icon('chat',15,'#0F2A4D')} فتح الصفقة</button>`}
  </div>`;
}
function directOfferCardHtml(o){
  const label = o.needsToJoin ? 'عرض جديد لأحد أغراضك' : STATUS_LABEL[o.offer.status] || o.offer.status;
  return `<div class="match-card">
    <div class="badge">${icon('user',16,'#C9942F')} ${label}</div>
    <div class="match-row">
      <div class="match-item-box"><div class="lbl">غرضك</div><div class="nm">${o.myItem?escapeHtml(o.myItem.title):'—'}</div></div>
      <span style="color:#C9942F;">⇄</span>
      <div class="match-item-box"><div class="lbl">غرض الطرف الآخر</div><div class="nm">${o.otherItem?escapeHtml(o.otherItem.title):'—'}</div></div>
    </div>
    <button class="btn sm gold" onclick="openDirectOfferById('${o.offer.id}')">${icon('chat',15,'#0F2A4D')} ${o.needsToJoin?'مراجعة العرض':'فتح الصفقة'}</button>
  </div>`;
}
function openDealFromMine(matchId){ const m = state.myMatches.find(x=>x.matchId===matchId); if (m) openDeal(m); }
function openDirectOfferById(offerId){ const o = state.directOffers.find(x=>x.offer.id===offerId); if (o) joinDirectOffer(o); }

  return `<div class="balance-card"><div class="lbl">رصيدك الحالي</div><div class="num">${state.balance}</div><div class="lbl">نقطة</div></div>
    <h2 class="section-title">سجل الحركات</h2>
    ${state.ledger.length ? state.ledger.map(l=>`<div class="ledger-row"><span class="t">${ledgerLabel(l.transaction_type)}</span><span class="a ${l.amount>=0?'pos':'neg'}">${l.amount>=0?'+':''}${l.amount}</span></div>`).join('') : `<div class="empty">لا حركات بعد - رصيدك يُبنى عند إتمام مبادلات فعلية</div>`}`;
}
function ledgerLabel(t){ return {trade_earn:'أرباح مبادلة', hold:'حجز لصفقة', release:'إفراج عن حجز', signup_bonus:'مكافأة تسجيل', referral_bonus:'مكافأة إحالة', adjustment:'تعديل يدوي'}[t]||t; }

function dealMessagesHtml(){
  const uid = state.session.user.id;
  if (!state.dealMessages.length) return `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:20px 0;">ابدآ المحادثة لترتيب التسليم</div>`;
  return state.dealMessages.map(m=>`<div class="bubble ${m.sender_id===uid?'mine':'theirs'}">${escapeHtml(m.content)}</div>`).join('');

function renderDeal(){
  const d = state.activeDeal;
  if (!d) return '';
  const offer = d.offer;
  let html = `<div class="deal-hero">
    <div class="swap-line">
      <div class="box"><div class="lbl">غرضك</div><div class="nm">${escapeHtml(d.myItem?.title||'')}</div></div>
      <span style="color:var(--gold);font-size:18px;">⇄</span>
      <div class="box"><div class="lbl">غرض الطرف الآخر</div><div class="nm">${escapeHtml(d.otherItem?.title||'')}</div></div>
    </div>
    ${d.otherRating ? `<div class="other-rating">${icon('star',15,'#E9CE9C')} ${d.otherRating.rating_avg} (${d.otherRating.rating_count} تقييم)</div>` : `<div class="other-rating" style="opacity:.6;">لا تقييمات بعد للطرف الآخر</div>`}
  </div>
  <div style="text-align:center;margin-bottom:16px;"><span class="status-pill ${offer.status}">${STATUS_LABEL[offer.status]}</span></div>`;

  if (!d.theyJoined){
    html += `<div class="empty">بانتظار الطرف الآخر لينضم لهذه الصفقة من حسابه</div>`;
  } else if (offer.status === 'negotiating'){
    html += `<div class="terms-box">
      <h2 class="section-title" style="font-size:14.5px;">تعديل شروط الصفقة (اختياري)</h2>
      <form id="terms-form">
        <div class="trow">
          <input id="d-points" type="number" step="1" placeholder="نقاط فرق القيمة" value="${offer.points_amount||''}">
          <select id="d-payer"><option value="me">أنا أدفعها</option><option value="them">الطرف الآخر يدفعها</option></select>
        </div>
        <button class="btn sm ghost" type="submit" style="width:100%;">تحديث الشروط</button>
      </form>
    </div>
    <button class="btn gold" onclick="handleAgree()" style="margin-bottom:12px;">${icon('check',18,'#0F2A4D')} اتفقنا - ننتقل للتسليم</button>`;
  } else if (offer.status === 'agreed'){
    if (offer.points_amount>0 && offer.points_payer_id===state.session.user.id && !d.iHeldPoints){
      html += `<div class="confirm-box"><p>يوجد فرق ${offer.points_amount} نقطة عليك دفعها - يُحجز المبلغ الآن ويُحرَّر تلقائياً عند إتمام المبادلة</p>
        <button class="btn sm" onclick="handleHoldPoints()">حجز النقاط الآن</button></div>`;
    } else {
      html += `<div class="confirm-box">
        <p>${d.iConfirmed ? 'تم تأكيد استلامك بالفعل - بانتظار تأكيد الطرف الآخر' : 'بعد استلام الغرض فعلياً، أكّد ذلك هنا لإتمام المبادلة'}</p>
        ${!d.iConfirmed ? `<button class="btn sm" onclick="handleConfirmReceipt()">${icon('check',15,'#fff')} تأكيد الاستلام</button>` : ''}
        ${d.theyConfirmed ? `<div style="margin-top:8px;font-size:12.5px;color:var(--success);font-weight:700;">✓ الطرف الآخر أكّد استلامه أيضاً</div>` : ''}
      </div>`;
    }
  } else if (offer.status === 'completed'){
    html += `<div class="stamp"><div class="stamp-badge">${icon('seal',36,'#3F6B4A')}</div><h3>تمّت المبادلة بنجاح</h3><p>قيّم تجربتك مع الطرف الآخر</p></div>
    <div class="rate-stars">${[1,2,3,4,5].map(n=>`<span class="${n<=state.myRating?'on':''}" onclick="setRatingStars(${n})">★</span>`).join('')}</div>
    <textarea id="rate-comment" placeholder="تعليق (اختياري)" style="margin-bottom:12px;"></textarea>
    <button class="btn gold" onclick="handleSubmitRating()">إرسال التقييم</button>`;
  } else if (offer.status === 'cancelled'){
    html += `<div class="empty">تم إلغاء هذه الصفقة</div>`;
  }

  if (d.theyJoined && ['negotiating','agreed'].includes(offer.status)){
    html += `<h2 class="section-title" style="margin-top:18px;">${icon('chat',18,'#0F2A4D')} المحادثة</h2>
    <div class="chat-wrap">
      <div class="chat-msgs" id="chat-msgs">${dealMessagesHtml()}</div>
      <form class="chat-input" id="chat-form"><input id="chat-input" placeholder="اكتب رسالة..."><button type="submit">${icon('send',20,'#C9942F')}</button></form>
    </div>
    <button class="btn danger sm" onclick="handleCancelDeal()">إلغاء الصفقة</button>
    <div class="report-link" onclick="handleReport()">الإبلاغ عن هذا الطرف</div>`;
  }
  return html;
}

function attachShellEvents(){
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.addEventListener('click',()=>goTo(b.dataset.v)));
  const back = document.getElementById('back-btn'); if (back) back.addEventListener('click', leaveDeal);
  const howitOpen = document.getElementById('howit-open'); if (howitOpen) howitOpen.addEventListener('click', openHowIt);
  const howitBack2 = document.getElementById('howit-back2'); if (howitBack2) howitBack2.addEventListener('click', closeHowIt);
  const profileOpen = document.getElementById('profile-open'); if (profileOpen) profileOpen.addEventListener('click', openProfile);
  const profileBack = document.getElementById('profile-back'); if (profileBack) profileBack.addEventListener('click', closeProfile);
  const itemDetailBack = document.getElementById('item-detail-back'); if (itemDetailBack) itemDetailBack.addEventListener('click', closeItemDetail);
  const startOfferBtn = document.getElementById('start-offer-btn'); if (startOfferBtn) startOfferBtn.addEventListener('click', startOfferPicker);
  const logoutBtn = document.getElementById('logout-btn'); if (logoutBtn) logoutBtn.addEventListener('click', handleSignOut);
  const editNameBtn = document.getElementById('edit-name-btn'); if (editNameBtn) editNameBtn.addEventListener('click', ()=>{ state.editingName=true; render(); });
  const nameForm = document.getElementById('name-form'); if (nameForm) nameForm.addEventListener('submit', (e)=>{ e.preventDefault(); handleSaveName(); });
  const dashAddBtn = document.getElementById('dash-add-btn'); if (dashAddBtn) dashAddBtn.addEventListener('click', ()=>goTo('add'));
  const dashBrowseBtn = document.getElementById('dash-browse-btn'); if (dashBrowseBtn) dashBrowseBtn.addEventListener('click', ()=>goTo('browse'));
  const addForm = document.getElementById('add-form'); if (addForm) addForm.addEventListener('submit', handleAddItem);
  const photoBox = document.getElementById('photo-upload-box');
  if (photoBox) photoBox.addEventListener('click', ()=>document.getElementById('photo-input').click());
  const photoInput = document.getElementById('photo-input'); if (photoInput) photoInput.addEventListener('change', handlePhotoSelect);
  const termsForm = document.getElementById('terms-form'); if (termsForm) termsForm.addEventListener('submit', handleUpdateTerms);
  const chatForm = document.getElementById('chat-form'); if (chatForm) chatForm.addEventListener('submit', handleSendMessage);
  const chatMsgs = document.getElementById('chat-msgs'); if (chatMsgs) chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

init();
</script>
</body>
</html>
