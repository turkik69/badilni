<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>بادلني</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%23122A47'/%3E%3Cpath d='M10 16h16M22 12l4 4-4 4' stroke='%23B8862E' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M30 24H14M18 28l-4-4 4-4' stroke='%23E9CE9C' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F7F4EC; --paper:#FFFFFF;
    --navy:#122A47; --navy-2:#1C3A5E; --navy-deep:#0F2338;
    --gold:#B8862E; --gold-light:#E9CE9C;
    --ink:#1A1F27; --muted:#6B6558; --line:#E4DFD1;
    --success:#3F6B4A; --success-bg:#E4EEE6;
    --warn:#8A3B26; --warn-bg:#F7E4DD;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Cairo',sans-serif; font-weight:500; -webkit-font-smoothing:antialiased;}
  #frame{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative; box-shadow:0 0 50px rgba(18,42,71,.08);}
  svg.ic{display:inline-block; vertical-align:middle;}

  /* ---------- Splash ---------- */
  .splash{height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--navy-deep); gap:16px;}
  .splash .mark{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.06);opacity:.85;}}
  .splash .word{color:var(--gold-light); font-weight:800; font-size:22px; letter-spacing:.5px;}

  /* ---------- Header / nav ---------- */
  header.topbar{background:var(--navy-deep); color:#fff; padding:16px 18px 14px; display:flex; align-items:center; gap:10px;}
  header.topbar .back{cursor:pointer; opacity:.85;}
  header.topbar .titles{flex:1;}
  header.topbar .screen-title{font-weight:700; font-size:16.5px;}
  header.topbar .brand-row{display:flex; align-items:center; gap:8px;}
  header.topbar .brand{font-weight:800; font-size:19px; color:var(--gold-light);}
  header.topbar .logout{font-size:12.5px; color:#9FB0C4; cursor:pointer; font-weight:600;}

  main{flex:1; padding:18px 18px 92px; overflow-y:auto;}

  nav.tabbar{position:absolute; bottom:0; right:0; left:0; background:#fff; border-top:1px solid var(--line); display:flex; padding:7px 4px calc(7px + env(safe-area-inset-bottom));}
  nav.tabbar button{flex:1; background:none; border:none; font-family:inherit; padding:7px 2px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:11px; font-weight:700;}
  nav.tabbar button.active{color:var(--navy);}
  nav.tabbar button.active svg{color:var(--gold);}
  .tab-dot{position:relative;}
  .tab-dot::after{content:''; position:absolute; top:-2px; left:15px; width:8px; height:8px; border-radius:50%; background:var(--warn); border:1.5px solid #fff;}

  /* ---------- Auth ---------- */
  .auth-wrap{padding:54px 26px 30px; text-align:center;}
  .auth-wrap h1{font-size:29px; font-weight:800; color:var(--navy); margin:16px 0 5px;}
  .auth-wrap p.tag{color:var(--muted); font-size:14px; margin-bottom:32px; line-height:1.75;}
  .field{text-align:right; margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:700;}
  input, select, textarea{width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; font-size:15px; background:#fff; color:var(--ink);}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--navy);}
  textarea{resize:vertical; min-height:64px;}
  .btn{width:100%; padding:14px; border:none; border-radius:10px; background:var(--navy); color:#fff; font-family:inherit; font-weight:700; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn:active{opacity:.85;}
  .btn.gold{background:var(--gold); color:var(--navy-deep);}
  .btn.ghost{background:#EFEBE3; color:var(--muted);}
  .btn.danger{background:var(--warn-bg); color:var(--warn);}
  .btn.sm{padding:10px; font-size:13.5px;}
  .btn[disabled]{opacity:.5; cursor:default;}
  .switch-mode{margin-top:18px; font-size:13.5px; color:var(--navy-2); cursor:pointer; font-weight:700;}
  .msg{font-size:13px; margin-top:14px; padding:10px 12px; border-radius:8px; text-align:right; line-height:1.6;}
  .msg.err{background:var(--warn-bg); color:var(--warn);}
  .msg.ok{background:var(--success-bg); color:var(--success);}
  .hint{font-size:11.5px; color:var(--muted); margin-top:24px; line-height:1.8;}

  h2.section-title{font-size:17px; font-weight:700; color:var(--navy); margin:2px 0 14px; display:flex; align-items:center; gap:8px;}
  .empty{text-align:center; padding:46px 20px; color:var(--muted); font-size:14px; line-height:1.85;}
  .empty svg{opacity:.35; margin-bottom:10px;}

  /* ---------- Item card ---------- */
  .item{position:relative; background:var(--paper); border:1px solid var(--line); border-radius:13px; padding:0; margin-bottom:13px; overflow:hidden; border-right:4px solid var(--navy);}
  .item .photo{width:100%; height:150px; object-fit:cover; display:block; background:var(--bg);}
  .item .photo-ph{width:100%; height:110px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--bg),#EFE9D8); font-size:34px;}
  .item .body{padding:13px 15px 14px;}
  .item .value-tag{position:absolute; top:10px; left:10px; background:var(--gold); color:var(--navy-deep); font-weight:800; font-size:12px; padding:4px 10px; border-radius:20px; z-index:2;}
  .item .cat{font-size:12px; color:var(--muted); font-weight:700; margin-bottom:3px; display:flex; align-items:center; gap:5px;}
  .item h3{font-size:15.5px; font-weight:700; margin:0 0 6px; color:var(--ink);}
  .item p.desc{font-size:13px; color:var(--muted); line-height:1.6; margin:0 0 9px;}
  .item .wants{font-size:12.5px; background:var(--bg); border-radius:8px; padding:8px 10px; color:var(--navy-2); font-weight:700; display:flex; gap:6px; align-items:flex-start;}
  .item .cond{display:inline-block; font-size:11px; font-weight:700; color:var(--success); background:var(--success-bg); padding:3px 9px; border-radius:20px; margin-top:9px;}

  /* ---------- Match / deal cards ---------- */
  .match-card{background:var(--paper); border:1.5px solid var(--gold); border-radius:13px; padding:14px 16px; margin-bottom:14px;}
  .match-card .badge{font-size:12px; font-weight:800; color:var(--gold); margin-bottom:11px; display:flex; align-items:center; gap:6px;}
  .match-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .match-item-box{flex:1; background:var(--bg); border-radius:9px; padding:10px 12px;}
  .match-item-box .lbl{font-size:10.5px; color:var(--muted); font-weight:700; margin-bottom:3px;}
  .match-item-box .nm{font-size:13.5px; font-weight:700; color:var(--ink);}
  .row-btns{display:flex; gap:8px;}
  .status-pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px;}
  .status-pill.suggested{background:#FCF1DD; color:var(--gold);}
  .status-pill.accepted, .status-pill.agreed, .status-pill.completed{background:var(--success-bg); color:var(--success);}
  .status-pill.dismissed, .status-pill.cancelled{background:#EFEBE3; color:var(--muted);}
  .status-pill.negotiating{background:#E6EEF5; color:var(--navy-2);}

  /* ---------- Deal view ---------- */
  .deal-hero{background:var(--navy-deep); color:#fff; border-radius:14px; padding:18px; margin-bottom:18px;}
  .deal-hero .swap-line{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .deal-hero .box{flex:1; background:rgba(255,255,255,.08); border-radius:10px; padding:10px 12px;}
  .deal-hero .box .lbl{font-size:10.5px; color:#9FB0C4; font-weight:700; margin-bottom:3px;}
  .deal-hero .box .nm{font-size:13.5px; font-weight:700;}
  .deal-hero .other-rating{font-size:12.5px; color:var(--gold-light); display:flex; align-items:center; gap:5px; margin-top:8px;}

  .stamp{display:flex; flex-direction:column; align-items:center; gap:10px; padding:30px 20px; text-align:center;}
  .stamp-badge{width:78px; height:78px; border-radius:50%; border:3px double var(--success); display:flex; align-items:center; justify-content:center; color:var(--success); transform:rotate(-8deg);}
  .stamp h3{color:var(--success); font-size:18px; margin:2px 0 4px;}
  .stamp p{color:var(--muted); font-size:13.5px; margin:0;}

  .terms-box{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:16px;}
  .terms-box .trow{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .terms-box .trow select{flex:1;}
  .terms-box .trow input{width:100px;}

  .confirm-box{background:var(--success-bg); border-radius:12px; padding:14px 16px; margin-bottom:16px;}
  .confirm-box p{font-size:13px; color:var(--success); margin:0 0 10px; line-height:1.7; font-weight:600;}

  .chat-wrap{display:flex; flex-direction:column; height:340px; border:1px solid var(--line); border-radius:12px; background:#fff; margin-bottom:14px; overflow:hidden;}
  .chat-msgs{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px;}
  .bubble{max-width:78%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.55;}
  .bubble.mine{align-self:flex-start; background:var(--navy); color:#fff; border-bottom-right-radius:4px;}
  .bubble.theirs{align-self:flex-end; background:var(--bg); color:var(--ink); border-bottom-left-radius:4px;}
  .chat-input{display:flex; border-top:1px solid var(--line); padding:8px;}
  .chat-input input{border:none; flex:1;}
  .chat-input button{background:none; border:none; color:var(--gold); cursor:pointer; padding:0 10px;}

  .rate-stars{display:flex; gap:6px; justify-content:center; margin:6px 0 16px; font-size:30px;}
  .rate-stars span{cursor:pointer; color:var(--line);}
  .rate-stars span.on{color:var(--gold);}

  /* ---------- Form ---------- */
  .check-row{display:flex; align-items:center; gap:8px; margin:6px 0 18px; font-size:13.5px; color:var(--navy-2); font-weight:600;}
  .photo-upload{border:1.5px dashed var(--line); border-radius:12px; padding:18px; text-align:center; margin-bottom:16px; cursor:pointer; color:var(--muted); font-size:13px; font-weight:600;}
  .photo-upload img{max-height:110px; border-radius:8px; margin-bottom:6px;}
  .cat-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px;}
  .cat-chip{border:1.5px solid var(--line); border-radius:11px; padding:12px 6px; text-align:center; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--muted);}
  .cat-chip .em{font-size:22px; display:block; margin-bottom:4px;}
  .cat-chip.sel{border-color:var(--gold); background:#FCF6EA; color:var(--navy);}

  /* ---------- Wallet ---------- */
  .balance-card{background:var(--navy-deep); color:#fff; border-radius:16px; padding:26px 20px; text-align:center; margin-bottom:22px;}
  .balance-card .lbl{font-size:12.5px; color:#9FB0C4; font-weight:700; margin-bottom:6px;}
  .balance-card .num{font-size:38px; font-weight:800; color:var(--gold-light);}
  .ledger-row{display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line);}
  .ledger-row .t{font-size:13px; color:var(--muted); font-weight:600;}
  .ledger-row .a{font-weight:800; font-size:14.5px;}
  .a.pos{color:var(--success);} .a.neg{color:var(--warn);}

  .report-link{text-align:center; font-size:12px; color:var(--muted); margin-top:18px; cursor:pointer; text-decoration:underline;}
</style>
</head>
<body>
<div id="frame"></div>

<script>
const SUPABASE_URL = 'https://kidmbxmbeiutgnexghyv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eZtfiyWq6Hqxus0Yu4aKDw_0VZM7H1T';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CAT_EMOJI = {smartphone:'📱', gamepad:'🎮', book:'📚'};
const COND_LABEL = {new:'جديد', like_new:'كالجديد', good:'جيد', fair:'مقبول'};
const STATUS_LABEL = {suggested:'مطابقة جديدة', accepted:'مقبولة', dismissed:'متجاهَلة', negotiating:'قيد التفاوض', agreed:'تم الاتفاق', completed:'مكتملة', cancelled:'ملغاة'};

function icon(name, size=20, color='currentColor'){
  const p = {
    search:'<circle cx="10" cy="10" r="6"/><line x1="20" y1="20" x2="14.6" y2="14.6"/>',
    plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    box:'<path d="M3 7.5l9-4 9 4-9 4-9-4z"/><path d="M3 7.5v9l9 4 9-4v-9"/><line x1="12" y1="11.5" x2="12" y2="20.5"/>',
    wallet:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="16" cy="14.5" r="1.4" fill="currentColor" stroke="none"/>',
    chat:'<path d="M4 5h16v11.5H8.5L4 20.5V5z"/>',
    seal:'<circle cx="12" cy="12" r="9"/><path d="M7.7 12.3l2.6 2.6L16.4 9"/>',
    swap:'<path d="M4 8.5h13.5M15 5.5l3 3-3 3"/><path d="M20 15.5H6.5M9 18.5l-3-3 3-3"/>',
    camera:'<path d="M4 8h3.2l1.6-2h6.4l1.6 2H20v11H4V8z"/><circle cx="12" cy="13.5" r="3.3"/>',
    flag:'<path d="M5 3v18"/><path d="M5 4.5h13l-3 4 3 4H5"/>',
    close:'<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
    back:'<polyline points="15 5 8 12 15 19"/>',
    check:'<polyline points="5 12 10 17 19 7"/>',
  };
  if (name === 'star'){
    return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}"><path d="M12 3.2l2.7 5.9 6.4.6-4.8 4.3 1.4 6.3-5.7-3.4-5.7 3.4 1.4-6.3-4.8-4.3 6.4-.6z"/></svg>`;
  }
  if (name === 'send'){
    return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}"><path d="M4 12l16-8-6.5 16-3-6.5z"/></svg>`;
  }
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p[name]||''}</svg>`;
}

function brandMark(size=64){
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="20" fill="#122A47"/>
    <path d="M10 16h16M22 12l4 4-4 4" stroke="#B8862E" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 24H14M18 28l-4-4 4-4" stroke="#E9CE9C" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

let state = {
  session:null, view:'browse', authMode:'signin', loading:false, authMsg:null, booting:true,
  categories:[], catMap:{},
  browseItems:[],
  myItems:[], myMatches:[],
  balance:0, ledger:[],
  newPhotoUrl:null, uploading:false, selectedCat:null,
  activeDeal:null, dealMessages:[], dealChannel:null, myRating:0,
};

const frame = document.getElementById('frame');

async function init(){
  frame.innerHTML = `<div class="splash">${brandMark(84)}<div class="word">بادلني</div></div>`;
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  sb.auth.onAuthStateChange((_e, session) => { state.session = session; });
  await loadCategories();
  state.booting = false;
  render();
  if (state.session) await loadAllForCurrentTab();
  render();
}

async function loadCategories(){
  const { data, error } = await sb.from('categories').select('*').eq('is_active', true);
  if (!error && data){ state.categories = data; state.catMap = Object.fromEntries(data.map(c => [c.id, c])); }
}
function catName(id){ return id && state.catMap[id] ? state.catMap[id].name_ar : null; }
function catEmoji(id){ return id && state.catMap[id] ? (CAT_EMOJI[state.catMap[id].icon] || '🔹') : '🔹'; }

/* ================= AUTH ================= */
async function handleAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  state.authMsg = null;
  if (!email || !password){ state.authMsg = {type:'err', text:'أدخلي البريد وكلمة المرور'}; render(); return; }
  try{
    if (state.authMode === 'signup'){
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (data.session){ state.session = data.session; }
      else state.authMsg = {type:'ok', text:'تم إنشاء الحساب - قد يصلك بريد لتأكيده، افتحيه واضغطي الرابط ثم سجّلي الدخول'};
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      state.session = data.session;
    }
  } catch(err){ state.authMsg = {type:'err', text: translateAuthError(err.message)}; }
  render();
  if (state.session){ await loadAllForCurrentTab(); render(); }
}
function translateAuthError(msg){
  if (/already registered|already exists/i.test(msg)) return 'هذا البريد مسجّل مسبقاً - جرّبي تسجيل الدخول';
  if (/invalid login|invalid.*credentials/i.test(msg)) return 'البريد أو كلمة المرور غير صحيحة';
  if (/password.*least/i.test(msg)) return 'كلمة المرور قصيرة جداً - 6 أحرف على الأقل';
  return msg;
}
async function handleSignOut(){ await sb.auth.signOut(); state.session = null; state.view = 'browse'; render(); }

/* ================= LOADING ================= */
async function loadAllForCurrentTab(){
  state.loading = true; render();
  if (state.view === 'browse') await loadBrowse();
  else if (state.view === 'mine') await loadMine();
  else if (state.view === 'wallet') await loadWallet();
  state.loading = false;
}
async function loadBrowse(){
  const uid = state.session.user.id;
  const { data } = await sb.from('items').select('*').eq('status','available').neq('owner_id', uid).order('created_at',{ascending:false});
  state.browseItems = data || [];
}
async function loadMine(){
  const uid = state.session.user.id;
  const { data: mine } = await sb.from('items').select('*').eq('owner_id', uid).order('created_at',{ascending:false});
  state.myItems = mine || [];
  const myIds = state.myItems.map(i=>i.id);
  state.myMatches = [];
  if (!myIds.length) return;
  const { data: myLinks } = await sb.from('match_items').select('match_id,item_id').in('item_id', myIds);
  if (!myLinks || !myLinks.length) return;
  const matchIds = [...new Set(myLinks.map(m=>m.match_id))];
  const { data: allLinks } = await sb.from('match_items').select('match_id,item_id').in('match_id', matchIds);
  const { data: matchRows } = await sb.from('matches').select('id,status').in('id', matchIds);
  const mStatus = Object.fromEntries((matchRows||[]).map(m=>[m.id,m.status]));
  const otherIds = [...new Set((allLinks||[]).filter(l=>!myIds.includes(l.item_id)).map(l=>l.item_id))];
  let otherItems = {};
  if (otherIds.length){ const { data: oi } = await sb.from('items').select('*').in('id', otherIds); otherItems = Object.fromEntries((oi||[]).map(i=>[i.id,i])); }
  const { data: existingOffers } = await sb.from('trade_offers').select('*').in('match_id', matchIds);
  const offerByMatch = Object.fromEntries((existingOffers||[]).map(o=>[o.match_id,o]));
  matchIds.forEach(mid=>{
    const links=(allLinks||[]).filter(l=>l.match_id===mid);
    const mine=links.find(l=>myIds.includes(l.item_id));
    const other=links.find(l=>!myIds.includes(l.item_id));
    if (mine && other && otherItems[other.item_id]){
      state.myMatches.push({matchId:mid, status:mStatus[mid]||'suggested', myItem:state.myItems.find(i=>i.id===mine.item_id), otherItem:otherItems[other.item_id], offer:offerByMatch[mid]||null});
    }
  });
}
async function loadWallet(){
  const uid = state.session.user.id;
  const { data: bal } = await sb.from('user_points_balance').select('balance').eq('user_id',uid).maybeSingle();
  state.balance = bal ? bal.balance : 0;
  const { data: ledger } = await sb.from('points_ledger').select('*').eq('user_id',uid).order('created_at',{ascending:false}).limit(30);
  state.ledger = ledger || [];
}

/* ================= ADD ITEM ================= */
async function handlePhotoSelect(e){
  const file = e.target.files[0];
  if (!file) return;
  state.uploading = true; render();
  try{
    const uid = state.session.user.id;
    const path = `${uid}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.\-]/g,'_')}`;
    const { error } = await sb.storage.from('item-photos').upload(path, file);
    if (error) throw error;
    const { data: pub } = sb.storage.from('item-photos').getPublicUrl(path);
    state.newPhotoUrl = pub.publicUrl;
  } catch(err){ alert('تعذّر رفع الصورة: ' + err.message); }
  state.uploading = false; render();
}
function selectCat(id){ state.selectedCat = id; render(); }
async function handleAddItem(e){

/* ================= MATCHES / DEAL ================= */
async function handleAcceptMatch(matchId){ await sb.from('matches').update({status:'accepted'}).eq('id',matchId); await loadMine(); render(); }
async function handleDismissMatch(matchId){ await sb.from('matches').update({status:'dismissed'}).eq('id',matchId); await loadMine(); render(); }

async function openDeal(match){
  state.loading = true; render();
  const uid = state.session.user.id;
  let offer = match.offer;
  if (!offer){
    const { data: created, error } = await sb.from('trade_offers').insert({ match_id: match.matchId, status:'negotiating' }).select().single();
    if (error){ alert('خطأ: '+error.message); state.loading=false; render(); return; }
    offer = created;
  }
  await sb.from('trade_offer_items').upsert({ trade_offer_id: offer.id, item_id: match.myItem.id, offered_by: uid }, { onConflict:'trade_offer_id,item_id' });
  await loadDeal(offer.id, match);
  state.view = 'deal';
  state.loading = false;
  render();
}

async function loadDeal(offerId, matchCtx){
  const uid = state.session.user.id;
  const { data: offer } = await sb.from('trade_offers').select('*').eq('id', offerId).single();
  const { data: parts } = await sb.from('trade_offer_items').select('*').eq('trade_offer_id', offerId);
  const { data: confirms } = await sb.from('trade_confirmations').select('*').eq('trade_offer_id', offerId);
  let myItem = matchCtx ? matchCtx.myItem : null, otherItem = matchCtx ? matchCtx.otherItem : null;
  if ((!myItem || !otherItem) && parts && parts.length){
    const itemIds = parts.map(p=>p.item_id);
    const { data: items } = await sb.from('items').select('*').in('id', itemIds);
    myItem = (items||[]).find(i=>i.owner_id===uid) || myItem;
    otherItem = (items||[]).find(i=>i.owner_id!==uid) || otherItem;
  }
  const otherOwnerId = otherItem ? otherItem.owner_id : null;
  let otherRating = null;
  if (otherOwnerId){ const { data: r } = await sb.from('user_ratings').select('*').eq('user_id', otherOwnerId).maybeSingle(); otherRating = r; }
  const iJoined = (parts||[]).some(p=>p.offered_by===uid);
  const theyJoined = (parts||[]).some(p=>p.offered_by===otherOwnerId);
  const iConfirmed = (confirms||[]).some(c=>c.user_id===uid);
  const theyConfirmed = (confirms||[]).some(c=>c.user_id===otherOwnerId);
  const myHold = (await sb.from('points_ledger').select('id').eq('related_trade_offer_id', offerId).eq('transaction_type','hold').eq('user_id', uid)).data;
  state.activeDeal = { offer, myItem, otherItem, otherOwnerId, otherRating, iJoined, theyJoined, iConfirmed, theyConfirmed, iHeldPoints: !!(myHold && myHold.length) };
  const { data: msgs } = await sb.from('messages').select('*').eq('trade_offer_id', offerId).order('created_at',{ascending:true});
  state.dealMessages = msgs || [];
  subscribeToDeal(offerId);
}

function subscribeToDeal(offerId){
  if (state.dealChannel) sb.removeChannel(state.dealChannel);
  state.dealChannel = sb.channel('deal-'+offerId)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages', filter:'trade_offer_id=eq.'+offerId}, payload=>{
      state.dealMessages.push(payload.new);
      renderDealMessagesOnly();
    }).subscribe();
}
function leaveDeal(){
  if (state.dealChannel){ sb.removeChannel(state.dealChannel); state.dealChannel=null; }
  state.activeDeal=null; state.dealMessages=[];
  state.view='mine'; render(); loadMine().then(render);
}

async function handleSendMessage(e){
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const content = input.value.trim();
  if (!content) return;
  input.value='';
  await sb.from('messages').insert({ trade_offer_id: state.activeDeal.offer.id, sender_id: state.session.user.id, content });
}

async function handleUpdateTerms(e){
  e.preventDefault();
  const amount = parseFloat(document.getElementById('d-points').value || '0');
  const payer = document.getElementById('d-payer').value;
  const uid = state.session.user.id;
  const payerId = payer === 'me' ? uid : state.activeDeal.otherOwnerId;
  const { error } = await sb.from('trade_offers').update({ points_amount: amount, points_payer_id: amount>0 ? payerId : null }).eq('id', state.activeDeal.offer.id);
  if (error){ alert('خطأ: '+error.message); return; }
  await loadDeal(state.activeDeal.offer.id); render();
}
async function handleAgree(){
  const { error } = await sb.from('trade_offers').update({ status:'agreed', agreed_at: new Date().toISOString() }).eq('id', state.activeDeal.offer.id);
  if (error){ alert('خطأ: '+error.message); return; }
  await loadDeal(state.activeDeal.offer.id); render();
}
async function handleHoldPoints(){
  const { error } = await sb.rpc('hold_trade_points', { p_trade_offer_id: state.activeDeal.offer.id });
  if (error){ alert(error.message); return; }
  await loadDeal(state.activeDeal.offer.id); render();
}
async function handleConfirmReceipt(){
  const { error } = await sb.rpc('confirm_trade_receipt', { p_trade_offer_id: state.activeDeal.offer.id });
  if (error){ alert(error.message); return; }
  await loadDeal(state.activeDeal.offer.id); render();
}
async function handleCancelDeal(){
  if (!confirm('هل تريدين إلغاء هذه الصفقة؟')) return;
  const { error } = await sb.rpc('cancel_trade_offer', { p_trade_offer_id: state.activeDeal.offer.id });
  if (error){ alert(error.message); return; }
  await loadDeal(state.activeDeal.offer.id); render();
}
function setRatingStars(n){ state.myRating = n; render(); }
async function handleSubmitRating(){
  const comment = document.getElementById('rate-comment') ? document.getElementById('rate-comment').value.trim() : '';
  if (!state.myRating){ alert('اختاري عدد النجوم'); return; }
  const { error } = await sb.from('reviews').insert({
    trade_offer_id: state.activeDeal.offer.id, reviewer_id: state.session.user.id,
    reviewee_id: state.activeDeal.otherOwnerId, rating: state.myRating, comment: comment || null
  });
  if (error){ alert('خطأ: '+error.message); return; }
  alert('شكراً على تقييمك!');
  leaveDeal();
}
async function handleReport(){
  const reason = prompt('ما سبب البلاغ؟');
  if (!reason) return;
  await sb.from('reports').insert({ reporter_id: state.session.user.id, reported_user_id: state.activeDeal.otherOwnerId, reported_item_id: state.activeDeal.otherItem.id, reason });
  alert('تم إرسال البلاغ - سنراجعه قريباً');
}

    }
  } else if (offer.status === 'completed'){
    html += `<div class="stamp"><div class="stamp-badge">${icon('seal',36,'#3F6B4A')}</div><h3>تمّت المبادلة بنجاح</h3><p>قيّمي تجربتك مع الطرف الآخر</p></div>
    <div class="rate-stars">${[1,2,3,4,5].map(n=>`<span class="${n<=state.myRating?'on':''}" onclick="setRatingStars(${n})">★</span>`).join('')}</div>
    <textarea id="rate-comment" placeholder="تعليق (اختياري)" style="margin-bottom:12px;"></textarea>
    <button class="btn gold" onclick="handleSubmitRating()">إرسال التقييم</button>`;
  } else if (offer.status === 'cancelled'){
    html += `<div class="empty">تم إلغاء هذه الصفقة</div>`;
  }

  if (d.theyJoined && ['negotiating','agreed'].includes(offer.status)){
    html += `<h2 class="section-title" style="margin-top:18px;">${icon('chat',18,'#122A47')} المحادثة</h2>
    <div class="chat-wrap">
      <div class="chat-msgs" id="chat-msgs">${dealMessagesHtml()}</div>
      <form class="chat-input" id="chat-form"><input id="chat-input" placeholder="اكتبي رسالة..."><button type="submit">${icon('send',20,'#B8862E')}</button></form>
    </div>
    <button class="btn danger sm" onclick="handleCancelDeal()">إلغاء الصفقة</button>
    <div class="report-link" onclick="handleReport()">الإبلاغ عن هذا الطرف</div>`;
  }
  return html;
}

function attachShellEvents(){
  document.getElementById('logout-btn').addEventListener('click', handleSignOut);
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.addEventListener('click',()=>goTo(b.dataset.v)));
  const back = document.getElementById('back-btn'); if (back) back.addEventListener('click', leaveDeal);
  const addForm = document.getElementById('add-form'); if (addForm) addForm.addEventListener('submit', handleAddItem);
  const photoBox = document.getElementById('photo-upload-box');
  if (photoBox) photoBox.addEventListener('click', ()=>document.getElementById('photo-input').click());
  const photoInput = document.getElementById('photo-input'); if (photoInput) photoInput.addEventListener('change', handlePhotoSelect);
  const termsForm = document.getElementById('terms-form'); if (termsForm) termsForm.addEventListener('submit', handleUpdateTerms);
  const chatForm = document.getElementById('chat-form'); if (chatForm) chatForm.addEventListener('submit', handleSendMessage);
  const chatMsgs = document.getElementById('chat-msgs'); if (chatMsgs) chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

init();
</script>
</body>
</html>
